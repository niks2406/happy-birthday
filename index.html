<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MayMay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            margin-bottom: 60px;
        }

        h1 {
            font-size: 4rem;
            color: #2c3e50;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: fadeInDown 1s ease-out;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            font-weight: 300;
        }

        .cake {
            font-size: 5rem;
            margin: 40px 0;
            animation: bounce 2s infinite;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .message {
            font-size: 1.3rem;
            color: #34495e;
            line-height: 1.8;
            margin: 40px 0;
            font-weight: 300;
        }

        .gallery-section {
            margin-top: 80px;
            padding-top: 60px;
            border-top: 1px solid rgba(52, 73, 94, 0.2);
        }

        .gallery-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .gallery-item {
            aspect-ratio: 1;
            background: #ecf0f1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #bdc3c7;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .instructions {
            color: #95a5a6;
            font-size: 0.9rem;
            margin-top: 20px;
            font-style: italic;
        }

        .action-button {
            margin-top: 40px;
            padding: 12px 30px;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 300;
        }

        .action-button:hover {
            background-color: #2980b9;
        }

        /* Confetti styles */
        .confetti {
            position: fixed;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            .cake {
                font-size: 3rem;
            }

            .message {
                font-size: 1.1rem;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Happy Birthday, MayMay! 🎉</h1>
            <p class="subtitle">Manifesting endless joy, love, and success for you!</p>
        </div>

        <div class="cake">🎂</div>

        <p class="message">
            Today is your special day! Celebrate every moment, make a wish, and enjoy being surrounded by love and happiness. You deserve all the best!
        </p>

        <button class="action-button" onclick="triggerConfetti()">Celebrate! 🎊</button>

        <div class="gallery-section">
            <h2 class="gallery-title">Gallery</h2>
            <div class="gallery" id="gallery">
                <div class="gallery-item">📸</div>
                <div class="gallery-item">🎈</div>
                <div class="gallery-item">🎁</div>
                <div class="gallery-item">✨</div>
                <div class="gallery-item">🎵</div>
                <div class="gallery-item">💝</div>
            </div>
           
        </div>
    </div>

    <script>
        function triggerConfetti() {
            const confettiCount = 50;
            const colors = ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6'];

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = '50%';
                confetti.style.opacity = Math.random() * 0.7 + 0.3;

                document.body.appendChild(confetti);

                const duration = Math.random() * 3 + 2;
                const xMove = (Math.random() - 0.5) * 400;
                const rotation = Math.random() * 720;

                confetti.animate(
                    [
                        {
                            transform: `translate(0, 0) rotate(0deg)`,
                            opacity: 1,
                        },
                        {
                            transform: `translate(${xMove}px, ${window.innerHeight + 20}px) rotate(${rotation}deg)`,
                            opacity: 0,
                        }
                    ],
                    {
                        duration: duration * 1000,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                        fill: 'forwards'
                    }
                );

                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

        // Auto-trigger confetti on page load
        window.addEventListener('load', () => {
            setTimeout(triggerConfetti, 500);
        });

        // Update gallery items with images (optional)
        function updateGalleryImage(index, imageUrl) {
            const gallery = document.getElementById('gallery');
            const item = gallery.children[index];
            if (item) {
                item.innerHTML = `<img src="${imageUrl}" alt="Gallery photo">`;
            }
        }

        // Example: uncomment and update with your image URLs
   updateGalleryImage(0, 'https://lh3.googleusercontent.com/d/1T-1Yw27J5g-sNQo-2nxU_RLn0VTwTWuT');
updateGalleryImage(1, 'https://lh3.googleusercontent.com/d/11JrxvJmwIpAsh9fJ2ilUvkrsNDt3A0KM');
updateGalleryImage(2, 'https://lh3.googleusercontent.com/d/1T-1Yw27J5g-sNQo-2nxU_RLn0VTwTWuT');
    </script>
</body>
</html>
